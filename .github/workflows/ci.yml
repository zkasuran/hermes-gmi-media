name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: 7a1b1d8d1123c3eb7c774b2eeaef6986cccc95c9
          path: hermes-agent
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: Install Hermes and pytest
        run: |
          uv venv --python 3.14
          # Run inside the checkout so Hermes' own [tool.uv] dependency overrides apply.
          (cd hermes-agent && uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" -e . pytest)
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "HERMES_HOME=$RUNNER_TEMP/hh" >> "$GITHUB_ENV"
      - run: python scripts/sync_shared.py --check
      - run: pytest -q
      - name: Validate plugins without warnings
        shell: bash
        run: |
          for plugin in gmi-image gmi-video gmi-speech; do
            hermes plugins validate "$plugin" | tee "$RUNNER_TEMP/$plugin-validation.txt"
            if grep -Ei 'warning|⚠' "$RUNNER_TEMP/$plugin-validation.txt"; then
              exit 1
            fi
          done
